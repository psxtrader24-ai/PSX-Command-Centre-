    <script type="text/javascript">
      // GitHub Pages relative base path fix:
      // If visited without a trailing slash (e.g. https://username.github.io/repo),
      // relative asset links like "./assets/index.js" resolve to "https://username.github.io/assets/index.js" (404).
      // Enforcing a trailing slash guarantees correct relative path resolution.
      (function() {
        var loc = window.location;
        if (loc.pathname && !loc.pathname.endsWith('/') && !loc.pathname.split('/').pop().includes('.')) {
          window.location.replace(loc.origin + loc.pathname + '/' + loc.search + loc.hash);
        }
      })();

      // GitHub Pages SPA deep link restoration
      (function() {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('p');
        if (redirect) {
          var cleanPath = decodeURIComponent(redirect);
          window.history.replaceState(null, '', cleanPath);
        }
      })();
    </script>
